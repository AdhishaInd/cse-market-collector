name: CSE event calendar

on:
  schedule:
    # Times are UTC; Colombo = UTC+5:30.
    - cron: "0 13 * * *"              # 18:30 Colombo daily, after the close and the evening filing rush
    - cron: "30 9 10-16 2,5,8,11 *"   # 15:00 Colombo on the 10th-16th of Feb/May/Aug/Nov (filing-deadline weeks)
    - cron: "30 16 * * *"             # 22:00 Colombo retry: does nothing if today's run already succeeded
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_EVENTS_URL: ${{ secrets.TURSO_EVENTS_URL }}
      TURSO_EVENTS_TOKEN: ${{ secrets.TURSO_EVENTS_TOKEN }}
      EVENTS_ROOT: ${{ github.workspace }}/events/work
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install pymupdf==2.0

      - name: Skip the retry if today is done
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "30 16 * * *" ] && python -I events/pipeline/events_sync.py done-today; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        if: steps.gate.outputs.skip != '1'
        run: python -I events/pipeline/test_events_incremental.py

      - name: Pull from Turso
        if: steps.gate.outputs.skip != '1'
        run: python -I events/pipeline/events_sync.py pull --root "$EVENTS_ROOT"

      - name: Refresh (fetch, load, check)
        if: steps.gate.outputs.skip != '1'
        id: refresh
        run: |
          set +e
          python -I events/pipeline/refresh_events.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Push results to Turso
        if: steps.gate.outputs.skip != '1'
        # always after a pull: feed snapshots must be kept even when the load is refused
        run: python -I events/pipeline/events_sync.py push-results --root "$EVENTS_ROOT"

      - name: Summary (counts only)
        if: always() && steps.gate.outputs.skip != '1'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          p = pathlib.Path(os.environ["EVENTS_ROOT"]) / "logs/events_daily/LAST_RUN.json"
          s = json.loads(p.read_text()) if p.exists() else {}
          print(f"as_of {s.get('as_of')} ok {s.get('ok')} exit {s.get('exit')}")
          print(f"\nchanges {json.dumps(s.get('counts'))}  feed gaps {len(s.get('gaps') or [])}")
          PY

      - name: Fail if the refresh failed
        if: steps.gate.outputs.skip != '1' && steps.refresh.outputs.rc != '0'
        run: |
          python - <<'PY'
          import json, os, pathlib
          s = json.loads((pathlib.Path(os.environ["EVENTS_ROOT"]) / "logs/events_daily/LAST_RUN.json").read_text())
          print("::error::refresh failed, exit", s.get("exit"), "-", (s.get("error") or "")[:300])
          PY
          exit 1

      - name: Letters waiting to be read
        if: success() && steps.gate.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python -I events/pipeline/letters.py needs-reading | wc -l)
          gh label create letters-need-reading --color FBCA04 2>/dev/null || true
          OPEN=$(gh issue list --label letters-need-reading --state open --json number --jq '.[0].number')
          if [ "$N" -gt 0 ] && [ -z "$OPEN" ]; then
            gh issue create --title "Rights letters waiting to be read" --label letters-need-reading \
              --body "$N rights issue letters could not be read automatically. Locally: \`python3 -I events/pipeline/events_sync.py needs-reading\` (see events/README.md, 'Reading flagged letters'). This issue closes itself when none are left."
          elif [ "$N" -eq 0 ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "No letters left to read."
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create events-failure --color B60205 2>/dev/null || true
          OPEN=$(gh issue list --label events-failure --state open --json number --jq '.[0].number')
          BODY="Event calendar refresh failed: $RUN_URL
          The main data is untouched. What to do per exit code: events/README.md ('On failure')."
          if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --body "$BODY"
          else gh issue create --title "Event calendar refresh failed $(TZ=Asia/Colombo date +%F)" --label events-failure --body "$BODY"; fi

      - name: Close failure issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label events-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
