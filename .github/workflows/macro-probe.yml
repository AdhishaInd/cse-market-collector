name: Macro source probe

# One request to each macro source, to see which hosts answer GitHub's network. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One request per host
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in \
            https://www.cbsl.gov.lk/en/statistics/economic-indicators/weekly-indicators \
            https://www.cbsl.lk/eresearch/ \
            https://www.statistics.gov.lk/InflationAndPrices/StaticalInformation/MonthlyCCPI
          do
            curl -sL -A "$UA" -m 90 -o /tmp/body -w "%{http_code} %{size_download} $u\n" "$u" || echo "curl-error $u"
            head -c 120 /tmp/body | tr '\n' ' '; echo
            sleep 5
          done
